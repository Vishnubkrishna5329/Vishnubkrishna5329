<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340">
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#10b981"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#060912"/></linearGradient>
</defs>
<style>
text{font-family:Consolas,'SF Mono',Menlo,'DejaVu Sans Mono','Courier New',monospace}
.lbl{font-size:11px;fill:#38bdf8;letter-spacing:1.5px}
.sec{font-size:12px;fill:#10b981;letter-spacing:1.5px;font-weight:700}
.k{font-size:13px;fill:#22d3ee;font-weight:700}
.v{font-size:14px;fill:#e6edf3}
.m{font-size:13px;fill:#94a3b8}
.chip{font-size:13px;fill:#e6edf3;font-weight:600}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.live{animation:pulse 1.6s ease-in-out infinite}
.cur{animation:blink 1s step-end infinite}
.row{animation:rise .5s ease-out both}
.pop{animation:pop .45s ease-out both}
</style>
<rect x="4" y="4" width="912" height="332" rx="14" fill="url(#bg)" stroke="url(#bd)" stroke-width="1.6"/>
<circle cx="26" cy="26" r="5" fill="#ff5f57"/>
<circle cx="42" cy="26" r="5" fill="#febc2e"/>
<circle cx="58" cy="26" r="5" fill="#28c840"/>
<text x="460.0" y="30" text-anchor="middle" font-size="12" fill="#94a3b8">vishnu@devos ~ % ls ~/repos --backend<tspan class="cur" fill="#22d3ee"> █</tspan></text>
<circle class="live" cx="854" cy="26" r="4" fill="#10b981"/><text x="896" y="30" text-anchor="end" font-size="11" fill="#10b981" letter-spacing="1.5">LIVE</text>
<line x1="4" y1="46" x2="916" y2="46" stroke="#1e293b"/>
<text class="lbl" x="30" y="70">PROJECTS</text>
<rect x="24" y="78" width="872" height="238" rx="10" fill="#050812" stroke="#22d3ee" stroke-opacity=".45"/>
<text class="sec" x="48" y="110">NAME</text><text class="sec" x="320" y="110">TYPE</text><text class="sec" x="430" y="110">DESCRIPTION</text>
<line x1="44" y1="120" x2="876" y2="120" stroke="#1e293b"/>
<g class="row" style="animation-delay:0.25s"><text class="m" x="48" y="148">❯</text><text class="v" x="66" y="148" font-weight="700">microservices</text><circle cx="326" cy="143" r="5" fill="#ED8B00"/><text class="m" x="338" y="148">Java</text><text class="v" x="430" y="148">Spring Boot microservices</text></g>
<g class="row" style="animation-delay:0.40s"><text class="m" x="48" y="182">❯</text><text class="v" x="66" y="182" font-weight="700">microservices-config</text><circle cx="326" cy="177" r="5" fill="#6DB33F"/><text class="m" x="338" y="182">Config</text><text class="v" x="430" y="182">Centralized configuration for the microservices</text></g>
<g class="row" style="animation-delay:0.55s"><text class="m" x="48" y="216">❯</text><text class="v" x="66" y="216" font-weight="700">multiple-datasource</text><circle cx="326" cy="211" r="5" fill="#ED8B00"/><text class="m" x="338" y="216">Java</text><text class="v" x="430" y="216">Spring Boot app with multiple data sources</text></g>
<g class="row" style="animation-delay:0.70s"><text class="m" x="48" y="250">❯</text><text class="v" x="66" y="250" font-weight="700">Java-Projects</text><circle cx="326" cy="245" r="5" fill="#ED8B00"/><text class="m" x="338" y="250">Java</text><text class="v" x="430" y="250">Collection of Java projects</text></g>
<g class="row" style="animation-delay:0.85s"><text class="m" x="48" y="284">❯</text><text class="v" x="66" y="284" font-weight="700">Patterns</text><circle cx="326" cy="279" r="5" fill="#ED8B00"/><text class="m" x="338" y="284">Java</text><text class="v" x="430" y="284">Number patterns in Java</text></g>
